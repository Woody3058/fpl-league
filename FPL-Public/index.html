<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FA Cuck FPL League</title>

    <link
        rel="stylesheet"
        href="css/style.css">
</head>

<body>

    <header>
        <h1>FA Cuck FPL League</h1>
        <div id="seasonTitle"></div>
    </header>

    <main>
        <nav class="main-navigation">
            <a
                href="index.html"
                class="active">
                Current Season
            </a>

            <a
                href="history.html">
                Historical Seasons
            </a>
        </nav>

        <section id="currentPeriodCard">
            <h2>Current Competition</h2>

            <div id="currentPeriodInfo"></div>
        </section>

        <section>
            <h2>Overall League</h2>

            <div class="table-container">
                <table id="overallTable">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Player</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>Gameweek Period Competition</h2>

            <div class="table-container">
                <table id="competitionTable">
                    <thead>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/data.js"></script>
    <script src="js/league.js"></script>
    <script src="js/competitions.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
