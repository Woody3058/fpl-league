
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        FA Cuck FPL League - Gameweeks
    </title>

    <link
        rel="stylesheet"
        href="css/style.css?v=1.2"
    >

</head>


<body>


<header>

    <h1>
        FA Cuck FPL League
    </h1>

    <div id="gameweekSeasonTitle">
    </div>

</header>


<main>

    <!-- ==================================
         NAVIGATION
         ================================== -->

        <nav class="main-navigation">

            <a
                href="index.html"
                class="nav-current"
            >
                Current Season
            </a>

            <a
                href="gameweeks.html"
                class="nav-gameweeks active"
            >
                Gameweeks
            </a>

            <a
                href="history.html"
                class="nav-history"
            >
                Historical Seasons
            </a>

            <a
                href="rules.html"
                class="nav-rules"
            >
                Rules & Prizes
            </a>

        </nav>


    <!-- ==================================
         GAMEWEEK SELECTOR
         ================================== -->

    <section>

        <div class="page-header">

            <h2>
                Gameweek Summary
            </h2>


            <div>

                <label
                    for="gameweekSummarySelector"
                >
                    Gameweek:
                </label>

                <select id="gameweekSummarySelector">
                </select>

            </div>

        </div>

    </section>


    <!-- ==================================
         GAMEWEEK HIGHLIGHTS
         ================================== -->

    <section class="season-prize-leaders">

        <div class="season-prize-leader-grid">


            <article class="season-prize-leader-card">

                <h3>
                    Top Scorer
                </h3>

                <strong id="gameweekTopScorer">
                    —
                </strong>

                <span id="gameweekTopScorerDetails">
                    —
                </span>

            </article>


            <article class="season-prize-leader-card">

                <h3>
                    Best Captain
                </h3>

                <strong id="gameweekBestCaptain">
                    —
                </strong>

                <span id="gameweekBestCaptainDetails">
                    —
                </span>

                <small class="season-prize-note">
                    Triple Captain selections are excluded.
                </small>

            </article>


            <article class="season-prize-leader-card">

                <h3>
                    Biggest Mover
                </h3>

                <strong id="gameweekBiggestMover">
                    —
                </strong>

                <span id="gameweekBiggestMoverDetails">
                    —
                </span>

            </article>


            <article class="season-prize-leader-card">

                <h3>
                    Gameweek
                </h3>

                <strong id="gameweekSelectedNumber">
                    —
                </strong>

                <span>
                    Selected gameweek
                </span>

            </article>


        </div>

    </section>


    <!-- ==================================
         GAMEWEEK RESULTS
         ================================== -->

    <section>

        <h2>
            Gameweek Results
        </h2>


        <div class="table-container">

            <table id="gameweekResultsTable">

                <thead>

                    <tr>

                        <th>
                            Pos
                        </th>

                        <th>
                            Player
                        </th>

                        <th>
                            GW Points
                        </th>

                        <th>
                            Overall
                        </th>

                        <th>
                            Move
                        </th>

                        <th>
                            Captain
                        </th>

                    </tr>

                </thead>


                <tbody>
                </tbody>

            </table>

        </div>

    </section>


</main>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/supabase.js?v=1.2"></script>
<script src="js/data.js?v=1.2"></script>
<script src="js/utils.js?v=1.2"></script>
<script src="js/gameweeks.js?v=1.2"></script>


</body>

</html>
